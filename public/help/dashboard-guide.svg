  <text x="204" y="381" fill="#61675f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Site mix location</text>
  <text x="408" y="369" fill="#101418" font-family="Arial, sans-serif" font-size="18" font-weight="800">3.600 m3</text>
