  <text x="204" y="463" fill="#61675f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Ready-mix location</text>
  <text x="408" y="451" fill="#101418" font-family="Arial, sans-serif" font-size="18" font-weight="800">2.800 m3</text>
