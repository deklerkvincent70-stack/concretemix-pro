  <circle cx="618" cy="445" r="22" fill="#d6d8d2"/><text x="607" y="452" fill="#767b72" font-family="Arial, sans-serif" font-size="14" font-weight="900">CM</text>
  <circle cx="693" cy="445" r="22" fill="#d6d8d2"/><text x="683" y="452" fill="#767b72" font-family="Arial, sans-serif" font-size="14" font-weight="900">SD</text>
  <circle cx="768" cy="445" r="22" fill="#d6d8d2"/><text x="758" y="452" fill="#767b72" font-family="Arial, sans-serif" font-size="14" font-weight="900">ST</text>
  <circle cx="843" cy="445" r="22" fill="#d6d8d2"/><text x="833" y="452" fill="#767b72" font-family="Arial, sans-serif" font-size="14" font-weight="900">AD</text>
  <circle cx="929" cy="445" r="22" fill="#1f7a5a"/><text x="923" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="900">P</text>
  <rect x="959" y="425" width="64" height="40" rx="6" fill="#ffffff" stroke="#d7d0bd" stroke-width="2"/>
  <text x="971" y="451" fill="#101418" font-family="Arial, sans-serif" font-size="17" font-weight="800">100%</text>
  <text x="1036" y="451" fill="#101418" font-family="Arial, sans-serif" font-size="18" font-weight="800">R 9,210</text>

  <rect x="86" y="528" width="216" height="56" rx="8" fill="#1f7a5a"/>
  <text x="146" y="563" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="900">Save Order</text>
  <rect x="322" y="528" width="216" height="56" rx="8" fill="#1f7a5a"/>
  <text x="377" y="563" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="900">Share Order</text>

  <rect x="626" y="528" width="488" height="56" rx="8" fill="#fff4ea" stroke="#e7bc9b" stroke-width="2"/>
  <text x="648" y="552" fill="#8a3b1d" font-family="Arial, sans-serif" font-size="15" font-weight="800">Color key: red = not ordered, amber = add to next PDF, green = received.</text>
  <text x="648" y="574" fill="#8a3b1d" font-family="Arial, sans-serif" font-size="15" font-weight="800">The P button follows the progress number.</text>

  <path d="M122 310 L122 258" stroke="#1f7a5a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M640 336 L640 258" stroke="#b8562f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M990 416 L990 500" stroke="#1f7a5a" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f7a5a"/>
    </marker>
  </defs>
