  <circle cx="693" cy="363" r="22" fill="#f0a51a"/><text x="683" y="370" fill="#101418" font-family="Arial, sans-serif" font-size="14" font-weight="900">SD</text>
  <circle cx="768" cy="363" r="22" fill="#d71920"/><text x="758" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="900">ST</text>
  <circle cx="843" cy="363" r="22" fill="#1f7a5a"/><text x="833" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="900">AD</text>
  <circle cx="929" cy="363" r="22" fill="#9b8a22"/><text x="923" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="900">P</text>
  <rect x="959" y="343" width="64" height="40" rx="6" fill="#ffffff" stroke="#d7d0bd" stroke-width="2"/>
  <text x="975" y="369" fill="#101418" font-family="Arial, sans-serif" font-size="17" font-weight="800">65%</text>
  <text x="1036" y="369" fill="#101418" font-family="Arial, sans-serif" font-size="18" font-weight="800">R 9,210</text>

  <rect x="86" y="404" width="1028" height="82" fill="#ffffff" stroke="#e4ddcc" stroke-width="2"/>
  <circle cx="123" cy="445" r="18" fill="none" stroke="#1f7a5a" stroke-width="5"/>
  <circle cx="123" cy="445" r="9" fill="#1f7a5a"/>
