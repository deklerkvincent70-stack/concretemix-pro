<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ConcreteMix Pro dashboard guide</title>
  <desc id="desc">Illustration of the Progress and Order Status Dashboard with project selector, row selector, material status buttons, progress and save or share buttons.</desc>
  <rect width="1200" height="720" fill="#f4f2ea"/>
  <rect x="56" y="44" width="1088" height="632" rx="16" fill="#ffffff" stroke="#d7d0bd" stroke-width="3"/>
