  <text x="86" y="126" fill="#61675f" font-family="Arial, sans-serif" font-size="18" font-weight="700">Select Material rows for reports. Amber order buttons are added to the shopping list PDF.</text>

  <rect x="86" y="160" width="392" height="72" rx="8" fill="#f4f2ea" stroke="#d7d0bd" stroke-width="2"/>
  <text x="106" y="186" fill="#61675f" font-family="Arial, sans-serif" font-size="15" font-weight="800">PROJECT</text>
  <text x="106" y="216" fill="#101418" font-family="Arial, sans-serif" font-size="22" font-weight="800">House slab project</text>

  <rect x="500" y="160" width="168" height="72" rx="8" fill="#eef1e8" stroke="#d7d0bd" stroke-width="2"/>
  <text x="516" y="186" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">PROJECT COST</text>
  <text x="516" y="216" fill="#101418" font-family="Arial, sans-serif" font-size="22" font-weight="800">R 18,420.00</text>

  <rect x="690" y="160" width="150" height="72" rx="8" fill="#eef1e8" stroke="#d7d0bd" stroke-width="2"/>
  <text x="706" y="186" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">MATERIAL ROWS</text>
  <text x="706" y="216" fill="#101418" font-family="Arial, sans-serif" font-size="22" font-weight="800">2</text>

  <rect x="862" y="160" width="150" height="72" rx="8" fill="#eef1e8" stroke="#d7d0bd" stroke-width="2"/>
  <text x="878" y="186" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">ORDER ITEMS</text>
  <text x="878" y="216" fill="#101418" font-family="Arial, sans-serif" font-size="22" font-weight="800">2</text>

  <rect x="86" y="268" width="1028" height="54" rx="8" fill="#f0f1ed"/>
  <text x="107" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">MATERIAL</text>
  <text x="204" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">LOCATION</text>
  <text x="408" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">WET VOL</text>
  <text x="525" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">MIX</text>
  <text x="607" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">CM</text>
  <text x="682" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">SD</text>
  <text x="757" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">ST</text>
  <text x="832" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">AD</text>
  <text x="914" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">POUR</text>
  <text x="994" y="302" fill="#61675f" font-family="Arial, sans-serif" font-size="14" font-weight="800">COST</text>

